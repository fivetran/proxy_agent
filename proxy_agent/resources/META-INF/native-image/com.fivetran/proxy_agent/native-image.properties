# Native Image initializes the HTTP handler at build time. Integrated proxy
# authentication goes through Windows, where the correct identity is selected.
Args = -Djdk.http.auth.tunneling.disabledSchemes=NTLM,Negotiate,Kerberos \
       -Djdk.http.auth.proxying.disabledSchemes=NTLM,Negotiate,Kerberos \
       -Dsun.net.http.retryPost=false
