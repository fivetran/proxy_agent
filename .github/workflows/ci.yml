name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run, which otherwise keeps
# two Windows runners busy for up to 45 minutes. Runs on main are never
# cancelled so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict --require-hashes --disable-pip -r tests/requirements.txt

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning install.sh proxy-agent-manager.sh tests/stub/heartbeat.sh

  psscriptanalyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($results) { exit 1 }

  unit:
    name: Unit tests (${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bash 5.1, the current Ubuntu Bash, and Bash 3.2 compatibility.
          - os: ubuntu-22.04
            shell: bash
          - os: ubuntu-latest
            shell: bash
          - os: macos-15
            shell: /bin/bash
          - os: windows-2022
            shell: powershell
          - os: windows-2022
            shell: pwsh
          - os: windows-2025
            shell: powershell
          - os: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PROXY_AGENT_TEST_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -v -m "not integration"

  integration-linux:
    name: Integration (Linux containers, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The published Linux image is multi-architecture (amd64 and arm64).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest tests/test_integration.py -v
        env:
          PROXY_AGENT_INTEGRATION: '1'
          PROXY_AGENT_TEST_SHELL: bash

  integration-windows:
    name: Integration (Windows containers, ${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Python launches the selected PowerShell executable for each script.
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Wait for the Docker daemon
        # The Docker service is not always running when a Windows job starts.
        shell: powershell
        run: |
          # The default 'Stop' preference would turn docker's stderr into a
          # terminating error on the first failed attempt.
          $ErrorActionPreference = 'Continue'
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          foreach ($attempt in 1..30) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          docker info
          exit 1
      - name: Run integration test
        run: python -m pytest tests/test_integration.py -v
        env:
          PROXY_AGENT_INTEGRATION: '1'
          PROXY_AGENT_TEST_SHELL: ${{ matrix.shell }}
