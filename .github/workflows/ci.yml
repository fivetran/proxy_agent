name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning install.sh proxy-agent-manager.sh tests/integration/linux.sh tests/stub/heartbeat.sh

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($results) { exit 1 }

  bats:
    name: Unit tests (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/bash

  pester:
    name: Unit tests (PowerShell 5.1, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester
        # Windows PowerShell 5.1 is what customers run the scripts with, so the
        # tests run there rather than under pwsh.
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path tests/pwsh -CI

  integration-linux:
    name: Integration (Linux containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/integration/linux.sh

  integration-windows:
    name: Integration (Windows containers, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run integration test
        shell: powershell
        run: tests/integration/windows.ps1
