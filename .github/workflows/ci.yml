name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run, which otherwise keeps
# two Windows runners busy for up to 45 minutes. Runs on main are never
# cancelled so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning install.sh proxy-agent-manager.sh tests/integration/linux.sh tests/stub/heartbeat.sh tests/bash/stubs/docker tests/bash/stubs/curl

  psscriptanalyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($results) { exit 1 }

  bats:
    name: Unit tests (bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/bash

  pester:
    name: Unit tests (${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        # Customers may run the scripts with Windows PowerShell 5.1
        # (powershell) or PowerShell 7 (pwsh); the scripts under test run in
        # the same host as Pester.
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester
        # Pester is pinned to 5.x since the tests use its syntax.
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge '5.0' -and $_.Version -lt '6.0' }
          if (-not $pester) {
            Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99
          Invoke-Pester -Path tests/pwsh -CI

  integration-linux:
    name: Integration (Linux containers, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The published Linux image is multi-architecture (amd64 and arm64).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: tests/integration/linux.sh

  integration-windows:
    name: Integration (Windows containers, ${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell]
        # PowerShell 7 runs on one OS only, since these jobs are slow.
        include:
          - os: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # The installer and manager run in the same host as the test.
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Docker daemon
        # The Docker service is not always running when a Windows job starts.
        shell: powershell
        run: |
          # The default 'Stop' preference would turn docker's stderr into a
          # terminating error on the first failed attempt.
          $ErrorActionPreference = 'Continue'
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          foreach ($attempt in 1..30) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          docker info
          exit 1
      - name: Run integration test
        run: tests/integration/windows.ps1

  unit:
    name: Python unit tests (${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bash 5.1, the current Ubuntu Bash, and Bash 3.2 compatibility.
          - os: ubuntu-22.04
            shell: bash
          - os: ubuntu-latest
            shell: bash
          - os: macos-15
            shell: /bin/bash
          - os: windows-2022
            shell: powershell
          - os: windows-2022
            shell: pwsh
          - os: windows-2025
            shell: powershell
          - os: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PROXY_AGENT_TEST_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  python-integration-linux:
    name: Python integration (Linux containers, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The published Linux image is multi-architecture (amd64 and arm64).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_integration.py -v
        env:
          PROXY_AGENT_INTEGRATION: '1'
          PROXY_AGENT_TEST_SHELL: bash

  python-integration-windows:
    name: Python integration (Windows containers, ${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Python launches the selected PowerShell executable for each script.
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the Docker daemon
        # The Docker service is not always running when a Windows job starts.
        shell: powershell
        run: |
          # The default 'Stop' preference would turn docker's stderr into a
          # terminating error on the first failed attempt.
          $ErrorActionPreference = 'Continue'
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          foreach ($attempt in 1..30) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          docker info
          exit 1
      - name: Run integration test
        run: python -m unittest discover -s tests -p test_integration.py -v
        env:
          PROXY_AGENT_INTEGRATION: '1'
          PROXY_AGENT_TEST_SHELL: ${{ matrix.shell }}
