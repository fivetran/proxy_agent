name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Git Bash would otherwise rewrite Bazel's //package:target arguments.
  MSYS2_ARG_CONV_EXCL: '//'

# A new push to a pull request cancels its previous run, which otherwise keeps
# two Windows runners busy for up to 45 minutes. Runs on main are never
# cancelled so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict --require-hashes --disable-pip -r tests/requirements.txt

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning install.sh proxy-agent-manager.sh tests/stub/heartbeat.sh

  psscriptanalyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        run: |
          pwsh -NoProfile -NonInteractive -Command 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop }'
          pwsh -NoProfile -NonInteractive -Command 'Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit -ErrorAction Stop'

  native-manager:
    name: Native manager (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the manager JAR
        run: bazelisk build //proxy_agent:manager_deploy.jar
      - uses: graalvm/setup-graalvm@v1.6.10
        with:
          distribution: graalvm-community
          version: '25.6.5.1'
          set-java-home: 'false'
      - name: Build the native manager
        env:
          MANAGER_PLATFORM: ${{ matrix.platform }}
        run: |
          compiler=native-image
          extension=
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=native-image.cmd
            extension=.exe
          fi
          mkdir -p dist
          binary="dist/manager-$MANAGER_PLATFORM"
          "$compiler" -Ob -jar bazel-bin/proxy_agent/manager_deploy.jar "$binary"
          sha256sum "$binary$extension" | cut -d ' ' -f 1 > "$binary$extension.sha256"
      - name: Check native installer failure handling
        if: matrix.platform == 'linux-x64'
        run: python3 tests/check_native_install.py dist/manager-linux-x64
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manager-${{ matrix.platform }}
          path: dist/manager-${{ matrix.platform }}*
          if-no-files-found: error

  unit:
    name: Unit tests (${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bash 5.1, the current Ubuntu Bash, and Bash 3.2 compatibility.
          - os: ubuntu-22.04
            shell: bash
          - os: ubuntu-latest
            shell: bash
          - os: macos-15
            shell: /bin/bash
          - os: windows-2022
            shell: powershell
          - os: windows-2022
            shell: pwsh
          - os: windows-2025
            shell: powershell
          - os: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PROXY_AGENT_TEST_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: bazelisk test //proxy_agent:tests //proxy_agent:update_manager_tests --test_output=errors
      - run: python -m pytest -v -m "not integration"

  integration-linux:
    name: Integration (Linux containers, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The published Linux image is multi-architecture (amd64 and arm64).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    needs: native-manager
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ runner.arch == 'ARM64' && 'manager-linux-aarch64' || 'manager-linux-x64' }}
          path: dist
      - run: |
          case "$(uname -m)" in
            x86_64) binary="$GITHUB_WORKSPACE/dist/manager-linux-x64" ;;
            aarch64) binary="$GITHUB_WORKSPACE/dist/manager-linux-aarch64" ;;
            *) exit 1 ;;
          esac
          chmod u+x "$binary"
          echo "PROXY_AGENT_MANAGER_BIN=$binary" >> "$GITHUB_ENV"
      - run: python -m pytest -v -m integration
        env:
          PROXY_AGENT_TEST_SHELL: bash

  integration-windows:
    name: Integration (Windows containers, ${{ matrix.shell }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    needs: native-manager
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - uses: actions/download-artifact@v8.0.2
        with:
          name: manager-windows-x64
          path: dist
      - name: Wait for the Docker daemon
        # The Docker service is not always running when a Windows job starts.
        run: |
          if ! docker info >/dev/null 2>&1; then
            sc.exe start docker || true
          fi
          for _ in {1..30}; do
            if docker info >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker info
      - name: Run integration test
        run: python -m pytest -v -m integration
        env:
          PROXY_AGENT_TEST_SHELL: ${{ matrix.shell }}
          PROXY_AGENT_MANAGER_BIN: ${{ github.workspace }}\dist\manager-windows-x64.exe

  release-manager:
    name: Publish native manager
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [dependency-audit, shellcheck, psscriptanalyzer, native-manager, unit, integration-linux, integration-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-native-manager
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: manager-*
          path: dist
          merge-multiple: true
      - name: Publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_manager.py
